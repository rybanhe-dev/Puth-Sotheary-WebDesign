<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .wrapper{
            width: 100%;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .content{
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .big{
            background-color: green;
            color: white;
            font-size: 30px;
        }

        .small{
            background-color: tomato;
            color: white;
            font-size: 10px;
            display: none;
        }
        @media only screen and (max-width: 600px) {
            .big {
                display: none;
            }

            .small {
                display: inline;
            }
        }
        .box-wrapper {
            width: 100%;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .box {
            width: clamp(300px, 70%, 800px);
            height: clamp(300px, 70vh, 800px);
            background-color: greenyellow;
        }
    </style>
</head>
<body>
    <div class="Wrapper">
        <div class="content">
            <span class="big">I'm BIG</span>
            <span class="small">I'm SMALL</span>
        </div>
    </div>

    <div class="box-wrapper">
        <div class="box"></div>
    </div>
</body>
</html>
