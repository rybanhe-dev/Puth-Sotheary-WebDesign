
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: white;
            padding: 30px;
        }

        .outer-box {
            width: 326px;
            margin: auto;
            padding: 13px 11px 9px;
            background: #527f91;
        }

        .form-card {
            background: white;
            border-radius: 5px;
            overflow: hidden;
        }

        .form-header {
            background: #eeeeee;
            text-align: center;
            padding: 10px;
            border-bottom: 1px solid #ddd;
        }

        .form-header h2 {
            font-size: 14px;
            color: #666;
        }

        form { 
            padding: 13px 18px 16px;
        }

        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px 6px;
        }

        .field {
            min-width: 0;
        }

        .full-width {
            grid-column: 1 / 3;
        }

        label,
        .field-title {
            display: block;
            font-size: 8px;
            color: #00b894;
            margin-bottom: 3px;
        }

        input[type="text"],
        input[type="email"],
        input[type="password"],
        input[type="number"],
        select,
        textarea {
            width: 100%;
            border: 1px solid #ddd;
            border-radius: 3px;
            padding: 4px;
            font-size: 8px;
        }

        input::placeholder {
            color: #bbb;
        }

        .choices {
            display: flex;
            align-items: center;
            flex-wrap: wrap;
            gap: 4px;
            font-size: 8px;
            color: #555;
        }

        .choices label {
            display: inline-flex;
            align-items: center;
            gap: 2px;
            margin: 0;
            color: #555;
            font-size: 8px;
        }

        input[type="radio"],
        input[type="checkbox"] {
            width: 8px;
            height: 8px;
            margin: 0;
        }

        select {
            padding: 2px;
        }

        .range-row {
            display: flex;
            align-items: center;
            gap: 5px;
        }

        input[type="range"] {
            width: 100%;
            accent-color: #00b894;
        }

        .range-value {
            background: #00b894;
            color: white;
            padding: 3px 4px;
            font-size: 8px;
            border-radius: 2px;
        }

        input[type="file"] {
            width: 100%;
            font-size: 8px;
        }

        input[type="file"]::file-selector-button {
            font-size: 8px;
            padding: 2px 4px;
        }

        textarea {
            height: 40px;
            resize: vertical;
        }

        .form-footer {
            background: #eee;
            border-top: 1px solid #ddd;
            padding: 7px 18px;
            display: flex;
            justify-content: flex-end;
        }

        button {
            background: #00b894;
            color: white;
            border: none;
            border-radius: 3px;
            padding: 6px 10px;
            font-size: 8px;
            cursor: pointer;
        }

        button:hover {
            background: #009f80;
        }

        @media (max-width: 400px) {
            body {
                padding: 15px;
            }

            .outer-box {
                width: 100%;
            }
        }
    </style>
</head>

<body>

<div class="outer-box">
    <div class="form-card">

        <div class="form-header">
            <h2>Create Account</h2>
        </div>

        <form>
            <div class="form-grid">

                <div class="field">
                    <label for="firstName">First name *</label>
                    <input type="text" id="firstName" placeholder="enter your first name" required>
                </div>

                <div class="field">
                    <label for="lastName">Last name</label>
                    <input type="text" id="lastName" placeholder="enter your last name">
                </div>

                <div class="field full-width">
                    <label for="email">Email *</label>
                    <input type="email" id="email" placeholder="enter your email" required>
                </div>

                <div class="field">
                    <label for="password">Password *</label>
                    <input type="password" id="password" placeholder="enter your password" required>
                </div>

                <div class="field">
                    <label for="confirmPassword"> Confirm Password * </label>
                    <input type="password" id="confirmPassword" placeholder="enter your password again" required>
                 </div>

                <div class="field">
                    <span class="field-title">Gender:</span>
                    <div class="choices">
                        <label>
                            <input type="radio" name="gender"> Male
                        </label>
                        <label>
                            <input type="radio" name="gender"> Female
                        </label>
                    </div>
                </div>

                <div class="field">
                    <span class="field-title">Hobbies</span>
                    <div class="choices">
                        <label><input type="checkbox"> Music</label>
                        <label><input type="checkbox"> Sports</label>
                        <label><input type="checkbox"> Travel</label>
                        <label><input type="checkbox"> Movies</label>
                    </div>
                </div>

                <div class="field">
                    <label for="incomeSource"> Source of Income </label>
                    <select id="incomeSource">
                        <option>Employed</option>
                        <option>Self-employed</option>
                        <option>Student</option>
                        <option>Unemployed</option>
                    </select>
                </div>

                <div class="field">
                    <label for="income">Income</label>
                    <div class="range-row">
                        <input type="range" id="income" min="0" max="100" value="20" oninput="incomeValue.textContent = this.value">
                    <span class="range-value" id="incomeValue"> 20K </span>
                    </div>
                </div>

                <div class="field">
                    <label for="picture"> Upload Profile Picture </label>
                    <input type="file" id="picture" accept="image/*">
                </div>

                <div class="field">
                    <label for="age">Age</label>
                    <input type="number" id="age" value="18">
                </div>

                <div class="field full-width">
                    <label for="bio">Bio</label>
                    <textarea id="bio"></textarea>
                </div>

            </div>
        </form>

        <div class="form-footer">
            <button type="submit">Create</button>
        </div>

    </div>
</div>

</body>
</html>
